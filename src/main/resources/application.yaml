spring:
  application:
    name: harpa-web

  # connection database
  datasource:
    url: jdbc:postgresql://postgres:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

cloudflare:
  r2:
    access-key: ${R2_ACCESS_KEY}
    secret-key: ${R2_SECRET_KEY}
    bucket: ${R2_BUCKET_NAME}
    endpoint: ${R2_ENDPOINT}
    public-url: ${R2_PUBLIC_URL}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 5s
  cache:
    type: redis

springdoc:
  api-docs:
    enabled: true
    path: /api-doc

    swagger-ui:
      enabled: true
      path: /swagger
      operationsSorter: method
      tagsSorter: alpha
      display-request-duration: true
      try-it-out-enabled: true
      filter: true
      doc-expansion: none
      persist-authorization: true

    packages-to-scan: com.mardenluiz.harpa.api